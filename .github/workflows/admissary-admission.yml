name: Admissary authority regressions and current fixture admission

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "migrations/**"
      - "Dockerfile"
      - "railway.json"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "data/accepted-artifacts.json"
      - "data/r13-*.json"
      - "data/banking77/**"
      - "data/verifier-fixtures/**"
      - "results/**/*.json"
      - "results/**/*.pem"
      - "web/*.json"
      - "web/**"
      - "RUN_WINDOWS.ps1"
      - "data/contracts/**"
      - "data/workloads/**"
      - "deploy/**"
      - "action.yml"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/**"
      - "deployment/**"
      - "contracts/**"
      - "models/**"
      - "policies/**"
      - "evaluation/**"

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: controlled-ci-only
          POSTGRES_DB: admissary_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      ADMISSARY_TEST_DATABASE_URL: postgresql://postgres:controlled-ci-only@localhost:5432/admissary_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run authority and validation regressions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Verify pinned live-candidate execution evidence offline
        run: node scripts/r13-final-live-candidate-evidence-gate.mjs

      - name: Generate explicit current-authority acceptance fixture
        run: node scripts/ci-fixture.mjs results/ci-current-fixture

      - name: Enforce exact-model deployment admission
        id: admissary
        uses: ./
        with:
          product-state: results/ci-current-fixture/product.json
          assurance-state: results/ci-current-fixture/assurance.json
          trust-store: results/ci-current-fixture/public-trust.json
          deployment-id: ci-acceptance-current
          context: results/ci-current-fixture/context.json
          report: artifacts/admissary-admission-report.json

      - name: Upload Admissary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admissary-admission-report
          path: artifacts/admissary-admission-report.json
          if-no-files-found: error
